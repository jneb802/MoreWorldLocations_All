[config]
schemaVersion = "0.0.1"

[package]
namespace = "warpalicious"
name = "More_World_Locations_AIO"
versionNumber = "5.0.9"
description = "Adds 185 new POI locations including dungeons, traders, ports and much more to enhance Valheim's world exploration."
websiteUrl = "https://discord.gg/3aaru2VyHJ"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2333"
ValheimModding-JsonDotNET = "13.0.4"
ValheimModding-YamlDotNET = "16.3.1"
ValheimModding-Jotunn = "2.29.1"

[build]
icon = "./icon.png"
readme = "./README_thunderstore.md"
outdir = "./build"

[[build.copy]]
source = "./More World Locations_AIO/bin/Release/More_World_Locations_AIO.dll"
target = "More_World_Locations_AIO.dll"

[[build.copy]]
source = "./assetBundleManifest_full"
target = "assetBundleManifest_full"

[[build.copy]]
source = "./plugins"
target = "plugins"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]
